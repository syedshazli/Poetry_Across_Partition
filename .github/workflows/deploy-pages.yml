name: Deploy exhibit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'poetry-exhibit/dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exhibit
        uses: actions/upload-pages-artifact@v3
        with:
          path: poetry-exhibit/dist

  # A separate job avoids looking up the artifact immediately after upload.
  # See https://github.com/actions/deploy-pages/issues/451.
  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
